[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "corm-prototype"
version = "0.2.0"
description = "Embodied Contract-Organ Machine research prototype"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "matplotlib>=3.8",
  "pytest>=8.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
